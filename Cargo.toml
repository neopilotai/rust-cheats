[workspace]
resolver = "2"
members = [
  "crates/cheats-core",
  "crates/cheats-data",
  "crates/cheats-search",
  "crates/cheats-complete",
  "crates/cheats-language",
  "crates/cheats-highlight",
  "crates/cheats-intent",
  "crates/cheats-config",
  "crates/cheats-lsp",
  "apps/cli",
  "apps/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"
authors = ["Rust Cheats Contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.28"
fuzzy-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tower-lsp-server = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
ratatui = "0.29"
